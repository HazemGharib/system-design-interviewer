<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1A7A6D" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="اتدرّب على تصميم الأنظمة خطوة بخطوة، واكشف النقط بعد ما تجاوب، وقيّم مستواك في الآخر." />
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="سيستم ديزاين" />
    <link rel="apple-touch-icon" href="/system-design-interviewer/apple-touch-icon.png" />
    
    <!-- iOS Splash Screen Colors -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/system-design-interviewer/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/system-design-interviewer/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/system-design-interviewer/favicon-16x16.png" />
    <!-- manifest injected by vite-plugin-pwa -->
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <title>تمرين مقابلة System Design</title>
    
    <style>
      /* Prevent FOUC */
      html {
        background-color: #F6F1E8;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #1a1a1a;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
